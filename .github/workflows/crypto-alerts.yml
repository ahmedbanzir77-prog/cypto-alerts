name: Alertes crypto Telegram

on:
  # Désactivé : le bot ne peut être lancé que manuellement.
  workflow_dispatch:

# Autorise uniquement ce workflow à mémoriser le dernier état observé.
permissions:
  contents: write

concurrency:
  group: crypto-alerts
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le bot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer le dernier état
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crypto-alert-state-${{ github.run_id }}
          restore-keys: crypto-alert-state-

      - name: Vérifier les adresses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SECONDS: "300"
        run: python monitor.py --once

      - name: Mémoriser les dernières transactions
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crypto-alert-state-${{ github.run_id }}

      # GitHub désactive les plannings des dépôts publics inactifs après 60 jours.
      # Un seul petit commit mensuel maintient donc ce dépôt actif.
      - name: Garder le planning actif
        if: success()
        run: |
          MONTH=$(date -u +%Y-%m)
          FILE=.github/last-scheduled-run.txt
          if [ ! -f "$FILE" ] || [ "$(cat "$FILE")" != "$MONTH" ]; then
            echo "$MONTH" > "$FILE"
            git config user.name "crypto-alerts[bot]"
            git config user.email "crypto-alerts[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore: keep scheduled alerts active"
            git push
          fi
